name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Unit Tests
        run: go test -v -count=1 -short ./...
      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
