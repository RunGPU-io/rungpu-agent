name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public source boundary
        run: bash scripts/audit-public.sh
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Unit Tests
        run: go test -v -count=1 -short ./...
      - name: GUI browser regressions
        run: node --test gui_browser_test.mjs
      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
